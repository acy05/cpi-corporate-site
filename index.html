<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="株式会社CPI コーポレートサイトの静止版・アニメーション版プレビュー">
  <title>株式会社CPI｜サイトプレビュー</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230c2948'/%3E%3Cpath d='M14 46 30 15l7 13-9 18zm18 0 8-14 10 14z' fill='%2374c6c8'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f5;color:#102a43;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{width:min(960px,calc(100% - 40px));padding:64px 0}.eyebrow{color:#16777c;font-size:.78rem;letter-spacing:.18em}.lead{max-width:680px;line-height:1.9;color:#526270}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:36px}.card{display:block;padding:32px;border:1px solid #dce3e1;border-radius:8px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 12px 32px rgba(16,42,67,.06);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#16777c}.card span{display:block;margin-top:18px;color:#16777c;font-weight:700}.note{margin-top:28px;color:#687884;font-size:.88rem;line-height:1.8}@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:36px 0}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">CPI CORPORATE WEBSITE</p>
    <h1>2つの表現からご確認ください。</h1>
    <p class="lead">掲載情報と導線は共通です。静止版は落ち着いた閲覧性を、アニメーション版はスクロールに合わせた段階的な情報提示を重視しています。</p>
    <div class="grid">
      <a class="card" href="static/">
        <h2>アニメーションなし</h2>
        <p>余白・写真・明朝体の文字組だけで信頼感を組み立てた静的な構成です。</p>
        <span>静止版を見る →</span>
      </a>
      <a class="card" href="motion/">
        <h2>アニメーションあり</h2>
        <p>フェード、スクロール表示、控えめなパララックスを加えた構成です。</p>
        <span>演出版を見る →</span>
      </a>
    </div>
    <p class="note">写真は提案確認用の生成イメージです。公開前に株式会社CPIの実際の人物・オフィス・外観写真へ差し替えてください。</p>
  </main>
</body>
</html>
